name: Deploy to homelab

on:
  push:
    branches: [main, master]

concurrency:
  group: homelab-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, homeserver]
    steps:
      - uses: actions/checkout@v4

      - name: Sync to deploy path
        run: bash ./scripts/sync-to-deploy-path.sh

      - name: Build and restart
        run: bash /homelab/civictech-crypto-engine/scripts/deploy-homelab.sh
